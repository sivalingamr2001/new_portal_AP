<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glassmorphic Pill BPF</title>
    <style>
        :root {
            --bg: #0f172a;
            --card-bg: rgba(30, 41, 59, 0.7);
            --border-neutral: rgba(255, 255, 255, 0.1);
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --green: #10b981;
            --red: #f43f5e;
        }
        body { font-family: system-ui, sans-serif; background-color: var(--bg); display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        
        .bpf-pill-track {
            background: var(--card-bg);
            border: 1px solid var(--border-neutral);
            backdrop-filter: blur(12px);
            border-radius: 100px;
            padding: 12px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            width: 100%;
            max-width: 900px;
            box-shadow: 0 20px 40px -15px rgba(0,0,0,0.5);
        }
        .step { display: flex; align-items: center; gap: 12px; position: relative; flex: 1; justify-content: center; }
        .step:not(:last-child)::after {
            content: '→'; color: var(--border-neutral); font-size: 18px; position: absolute; right: -10px;
        }
        .bubble {
            width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
            font-weight: 700; font-size: 13px; border: 2px solid var(--border-neutral); color: var(--text-muted); background: rgba(255,255,255,0.02);
        }
        .meta { display: flex; flex-direction: column; }
        .title { color: var(--text-main); font-size: 14px; font-weight: 600; margin: 0; }
        .sub { color: var(--text-muted); font-size: 11px; margin: 0; }

        /* States */
        .step.status-completed .bubble { background: var(--green); border-color: var(--green); color: #000; }
        .step.status-inprogress .bubble { border-color: var(--green); color: var(--green); box-shadow: 0 0 15px rgba(16, 185, 129, 0.3); }
        .step.status-inprogress .sub { color: var(--green); }
        .step.status-destructive .bubble { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 0 15px rgba(244, 63, 94, 0.4); }
        .step.status-destructive .sub { color: var(--red); }
    </style>
</head>
<body>
    <div class="bpf-pill-track">
        <div class="step status-completed">
            <div class="bubble">✓</div>
            <div class="meta"><p class="title">Current Status</p><p class="sub">Submitted</p></div>
        </div>
        <div class="step status-inprogress">
            <div class="bubble">2</div>
            <div class="meta"><p class="title">Cash Flow</p><p class="sub">Pending with IT</p></div>
        </div>
        <div class="step">
            <div class="bubble">3</div>
            <div class="meta"><p class="title">Assumptions</p><p class="sub">Awaiting review</p></div>
        </div>
        <div class="step">
            <div class="bubble">4</div>
            <div class="meta"><p class="title">Results</p><p class="sub">Projections</p></div>
        </div>
    </div>
</body>
</html>
